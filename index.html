  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

:center;justify-content:center;gap:7px;padding:11px 18px;border-radius:999px;background:#1A55D0;color:#fff;font-size:14px;font-weight:600;flex:1 1 auto;min-width:150px;\">Aula experimental<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fheader>\n\n<main id=\"top\">\n\n<section style=\"padding:clamp(40px,6vw,76px) 22px clamp(28px,4vw,44px);\">\n  <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(32px,5vw,64px);align-items:center;\">\n    <div style=\"flex:1 1 420px;min-width:min(100%,300px);\">\n      <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:20px;\"><span style=\"width:18px;height:1px;background:#1A55D0;display:block;\"><\u002Fspan>Aulas particulares online<\u002Fspan>\n      <h1 style=\"font-size:clamp(38px,5.6vw,64px);line-height:1.03;letter-spacing:-.035em;font-weight:600;margin-bottom:22px;text-wrap:balance;\">Destrave seu inglês falando sobre o que <span style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;color:#1A55D0;\">você já ama<\u002Fspan>.<\u002Fh1>\n      <p style=\"font-size:clamp(17px,2vw,19px);color:#6B655D;max-width:520px;margin-bottom:32px;text-wrap:pretty;\">Aula individual, 100% online, montada a partir dos seus interesses — futebol, séries, trabalho ou sua próxima viagem. Você aprende mais rápido porque tem vontade de falar sobre aquilo.<\u002Fp>\n      <div style=\"display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:26px;\">\n        <a href=\"#contato\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:16px 28px;border-radius:999px;background:#1A55D0;color:#fff;font-size:16px;font-weight:600;box-shadow:0 8px 22px -10px rgba(26,85,208,.55);flex:1 1 260px;\">Quero minha aula experimental<\u002Fa>\n        <a href=\"{{ waGeral }}\" target=\"_blank\" rel=\"noopener\" style=\"display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:16px 22px;border-radius:999px;border:1px solid #DDD5C8;font-size:15px;font-weight:500;flex:1 1 180px;\">Prefiro o WhatsApp<\u002Fa>\n      <\u002Fdiv>\n      <p style=\"font-size:13.5px;color:#8C857A;\">Conversa inicial de 20 minutos, gratuita e sem compromisso.<\u002Fp>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 380px;min-width:min(100%,290px);position:relative;\">\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"max-width:1140px;margin:clamp(44px,6vw,72px) auto 0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:0 clamp(20px,3vw,40px);border-bottom:1px solid #EBE5DB;\">\n    <div style=\"padding:20px 0;border-top:1px solid #EBE5DB;\"><b style=\"display:block;font-size:17px;font-weight:600;margin-bottom:3px;\">6 anos<\u002Fb><span style=\"font-size:13.5px;color:#6B655D;\">ensinando inglês, do zero à fluência<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:20px 0;border-top:1px solid #EBE5DB;\"><b style=\"display:block;font-size:17px;font-weight:600;margin-bottom:3px;\">Horário flexível<\u002Fb><span style=\"font-size:13.5px;color:#6B655D;\">manhã, noite ou fim de semana<\u002Fspan><\u002Fdiv>\n    <div style=\"padding:20px 0;border-top:1px solid #EBE5DB;\"><b style=\"display:block;font-size:17px;font-weight:600;margin-bottom:3px;\">Zero apostila<\u002Fb><span style=\"font-size:13.5px;color:#6B655D;\">o conteúdo nasce personalizado com seu interesse<\u002Fspan><\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"alunos\" style=\"padding:clamp(56px,7vw,104px) 22px;\">\n  <div style=\"max-width:1140px;margin:0 auto;\">\n    <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:18px;\"><span style=\"width:18px;height:1px;background:#1A55D0;display:block;\"><\u002Fspan>Quem já passou por aqui<\u002Fspan>\n    <h2 style=\"font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;font-weight:600;margin-bottom:14px;text-wrap:balance;\">De \"how to say...\" a uma conversa inteira em inglês.<\u002Fh2>\n    <p style=\"font-size:17px;color:#6B655D;max-width:560px;margin-bottom:44px;\">A mudança não é de vocabulário, é de confiança. Foi assim com o Rafael, a Beatriz e o Diego.<\u002Fp>\n\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;align-items:start;\">\n      <div style=\"background:#fff;border:1px solid #EBE5DB;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:18px;\">\n        <p style=\"font-size:16px;line-height:1.55;text-wrap:pretty;\">\"Depois de uns meses de aula eu já entrava em reunião em inglês sem aquele nó na garganta.\"<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:11px;margin-top:auto;\">\n          <div style=\"width:36px;height:36px;border-radius:50%;background:#E7EEFB;color:#1A55D0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;\">RM<\u002Fdiv>\n          <div><div style=\"font-size:14px;font-weight:600;\">Rafael M.<\u002Fdiv><div style=\"font-size:12.5px;color:#8C857A;\">Reuniões em multinacional<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #EBE5DB;border-radius:20px;padding:26px;display:flex;flex-direction:column;gap:18px;\">\n        <p style=\"font-size:16px;line-height:1.55;text-wrap:pretty;\">\"Cheguei no intercâmbio já entendendo o que as pessoas falavam. Fez toda diferença.\"<\u002Fp>\n        <div style=\"display:flex;align-items:center;gap:11px;margin-top:auto;\">\n          <div style=\"width:36px;height:36px;border-radius:50%;background:#E7EEFB;color:#1A55D0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;\">BS<\u002Fdiv>\n          <div><div style=\"font-size:14px;font-weight:600;\">Beatriz S.<\u002Fdiv><div style=\"font-size:12.5px;color:#8C857A;\">Intercâmbio na Irlanda<\u002Fdiv><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"professora\" style=\"padding: clamp(56px,7vw,104px) 22px; background: #F5F1EA; position: relative\">\n  <div style=\"max-width:1140px;margin:0 auto;display:flex;flex-wrap:wrap;gap:clamp(30px,5vw,60px);align-items:center;\">\n    <div style=\"flex:1 1 300px;min-width:min(100%,260px);max-width:400px;display:flex;flex-direction:column;gap:14px;\">\n      <div style=\"border-radius:22px;overflow:hidden;border:1px solid #E3DCD1;aspect-ratio:1/1;background:#EAE4DA;\">\n        <img src=\"6697d6bd-4a51-4249-9246-a95256453ea6\" alt=\"Rayanne, professora de inglês\" style=\"width:100%;height:100%;object-fit:cover;object-position:50% 16%;\">\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #EBE5DB;border-radius:18px;padding:14px 18px;box-shadow:0 18px 34px -20px rgba(22,19,15,.3);\">\n        <div style=\"font-size:14.5px;font-weight:600;margin-bottom:3px;\">Rayanne<\u002Fdiv>\n        <div style=\"font-size:12.5px;color:#8C857A;line-height:1.4;\">Letras — UFRJ · 6 anos de sala de aula<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"flex:1 1 420px;min-width:min(100%,300px);\">\n      <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:18px;\"><span style=\"width:18px;height:1px;background:#1A55D0;display:block;\"><\u002Fspan>A professora<\u002Fspan>\n      <h2 style=\"font-size:clamp(26px,3.6vw,38px);letter-spacing:-.03em;font-weight:600;margin-bottom:20px;text-wrap:balance;\">Quem vai te ensinar a pensar em inglês.<\u002Fh2>\n      <p style=\"font-size:16.5px;color:#5A544C;line-height:1.65;margin-bottom:18px;max-width:540px;text-wrap:pretty;\">Formada em Letras pela UFRJ, construí minha base como professora dentro de um colégio bilíngue — onde aprendi, na prática, que cada aluno chega à fluência por um caminho diferente.<\u002Fp>\n      <p style=\"font-size:16.5px;color:#5A544C;line-height:1.65;margin-bottom:28px;max-width:540px;text-wrap:pretty;\">Hoje trago essa experiência pras aulas particulares: um plano pensado pro seu jeito de aprender, com foco total em aulas personalizadas.<\u002Fp>\n      <ul style=\"display:flex;flex-direction:column;\">\n        <li style=\"font-size:15px;padding:13px 0;border-top:1px solid #E3DCD1;display:flex;gap:11px;align-items:baseline;\"><span style=\"color:#1A55D0;font-weight:700;\">—<\u002Fspan>Formação em Letras pela UFRJ<\u002Fli>\n        <li style=\"font-size:15px;padding:13px 0;border-top:1px solid #E3DCD1;display:flex;gap:11px;align-items:baseline;\"><span style=\"color:#1A55D0;font-weight:700;\">—<\u002Fspan>Experiência em colégio bilíngue<\u002Fli>\n        <li style=\"font-size:15px;padding:13px 0;border-top:1px solid #E3DCD1;display:flex;gap:11px;align-items:baseline;\"><span style=\"color:#1A55D0;font-weight:700;\">—<\u002Fspan>Aulas para adultos e adolescentes, do zero ao avançado<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"publico\" style=\"padding:clamp(56px,7vw,104px) 22px;\">\n  <div style=\"max-width:1140px;margin:0 auto;\">\n    <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:18px;\"><span style=\"width:18px;height:1px;background:#1A55D0;display:block;\"><\u002Fspan>Pra quem é<\u002Fspan>\n    <h2 style=\"font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;font-weight:600;margin-bottom:14px;text-wrap:balance;\">Duas jornadas, um mesmo objetivo: falar sem travar.<\u002Fh2>\n    <p style=\"font-size:17px;color:#6B655D;max-width:560px;margin-bottom:44px;\">O plano muda dependendo de quem senta do outro lado da tela — o foco em conversação real é sempre o mesmo.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:18px;\">\n      <div style=\"background:#fff;border:1px solid #EBE5DB;border-radius:20px;padding:clamp(26px,3vw,36px);\">\n        <h3 style=\"font-size:23px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px;\">Para adultos<\u002Fh3>\n        <p style=\"font-size:15px;color:#6B655D;margin-bottom:22px;\">Pra quem precisa do inglês pra viajar, trabalhar em empresa internacional ou parar de congelar numa conversa.<\u002Fp>\n        <ul>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Viagens e situações do dia a dia<\u002Fli>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Entrevistas e inglês corporativo<\u002Fli>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Morar ou trabalhar fora do Brasil<\u002Fli>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Confiança pra falar sem travar<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #EBE5DB;border-radius:20px;padding:clamp(26px,3vw,36px);\">\n        <h3 style=\"font-size:23px;font-weight:600;letter-spacing:-.02em;margin-bottom:10px;\">Para adolescentes<\u002Fh3>\n        <p style=\"font-size:15px;color:#6B655D;margin-bottom:22px;\">Reforço com foco em conversação de verdade — além da gramática que já vem da escola.<\u002Fp>\n        <ul>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Preparação para intercâmbio<\u002Fli>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Reforço com foco em conversação<\u002Fli>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Provas e certificados (TOEFL, admissão)<\u002Fli>\n          <li style=\"font-size:15px;padding:12px 0;border-top:1px solid #F0EBE3;\">Confiança pra usar inglês fora da sala<\u002Fli>\n        <\u002Ful>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"como-funciona\" style=\"padding:clamp(56px,7vw,104px) 22px;background:#F5F1EA;\">\n  <div style=\"max-width:1140px;margin:0 auto;\">\n    <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:18px;\"><span style=\"width:18px;height:1px;background:#1A55D0;display:block;\"><\u002Fspan>Como funciona<\u002Fspan>\n    <h2 style=\"font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;font-weight:600;margin-bottom:14px;text-wrap:balance;\">Do primeiro \"oi\" à primeira conversa fluente.<\u002Fh2>\n    <p style=\"font-size:17px;color:#6B655D;max-width:560px;margin-bottom:40px;\">Três passos pra começar — sem contrato longo, sem apostila fechada.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:18px;\">\n      <div style=\"background:#fff;border:1px solid #E3DCD1;border-radius:20px;padding:28px;\">\n        <div style=\"font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:14px;\">Passo 1<\u002Fdiv>\n        <h3 style=\"font-size:19px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em;\">Conversa inicial gratuita<\u002Fh3>\n        <p style=\"font-size:15px;color:#6B655D;\">20 minutos de papo (pode ser em português) pra entender seu nível e o que você quer alcançar.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E3DCD1;border-radius:20px;padding:28px;\">\n        <div style=\"font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:14px;\">Passo 2<\u002Fdiv>\n        <h3 style=\"font-size:19px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em;\">Plano personalizado<\u002Fh3>\n        <p style=\"font-size:15px;color:#6B655D;\">Monto temas e ritmo a partir dos seus interesses e do seu objetivo: viagem, trabalho, prova ou intercâmbio.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #E3DCD1;border-radius:20px;padding:28px;\">\n        <div style=\"font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:14px;\">Passo 3<\u002Fdiv>\n        <h3 style=\"font-size:19px;font-weight:600;margin-bottom:8px;letter-spacing:-.01em;\">Aulas semanais ao vivo<\u002Fh3>\n        <p style=\"font-size:15px;color:#6B655D;\">Conversação de verdade, correções na hora e material de apoio depois de cada encontro.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<sc-if value=\"{{ showPlanos }}\" hint-placeholder-val=\"{{ true }}\">\n<section id=\"planos\" style=\"padding:clamp(56px,7vw,104px) 22px;\">\n  <div style=\"max-width:1140px;margin:0 auto;\">\n    <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:18px;\"><span style=\"width:18px;height:1px;background:#1A55D0;display:block;\"><\u002Fspan>Planos<\u002Fspan>\n    <h2 style=\"font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;font-weight:600;margin-bottom:14px;text-wrap:balance;\">Escolha o ritmo que funciona pra você.<\u002Fh2>\n    <p style=\"font-size:17px;color:#6B655D;max-width:560px;margin-bottom:44px;\">Todos os planos incluem plano de estudos personalizado e material de apoio digital.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:18px;align-items:stretch;\">\n      <div style=\"background:#fff;border:1px solid #EBE5DB;border-radius:20px;padding:30px;display:flex;flex-direction:column;\">\n        <h3 style=\"font-size:15px;font-weight:600;color:#6B655D;margin-bottom:16px;\">Aula avulsa<\u002Fh3>\n        <div style=\"font-size:36px;font-weight:600;letter-spacing:-.03em;margin-bottom:4px;\">R$ 90<span style=\"font-size:14px;font-weight:400;color:#8C857A;\">/aula<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#8C857A;margin-bottom:24px;\">Sem compromisso mensal<\u002Fdiv>\n        <ul style=\"flex:1;margin-bottom:26px;\">\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">1 aula de 50 min<\u002Fli>\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">Material de apoio digital<\u002Fli>\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">Ideal pra experimentar<\u002Fli>\n        <\u002Ful>\n        <a href=\"#contato\" style=\"display:flex;justify-content:center;padding:13px;border-radius:999px;border:1px solid #DDD5C8;font-size:15px;font-weight:500;\">Começar<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1.5px solid #1A55D0;border-radius:20px;padding:30px;display:flex;flex-direction:column;position:relative;box-shadow:0 20px 40px -26px rgba(26,85,208,.5);\">\n        <span style=\"position:absolute;top:-12px;left:30px;background:#16130F;color:#fff;font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600;padding:6px 13px;border-radius:999px;\">Mais escolhido<\u002Fspan>\n        <h3 style=\"font-size:15px;font-weight:600;color:#6B655D;margin-bottom:16px;\">Mensal · 4 aulas<\u002Fh3>\n        <div style=\"font-size:36px;font-weight:600;letter-spacing:-.03em;margin-bottom:4px;\">R$ 290<span style=\"font-size:14px;font-weight:400;color:#8C857A;\">/mês<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#8C857A;margin-bottom:24px;\">1 aula por semana<\u002Fdiv>\n        <ul style=\"flex:1;margin-bottom:26px;\">\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">4 aulas de 50 min<\u002Fli>\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">Plano de estudos personalizado<\u002Fli>\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">Correções e feedback por WhatsApp<\u002Fli>\n        <\u002Ful>\n        <a href=\"#contato\" style=\"display:flex;justify-content:center;padding:13px;border-radius:999px;background:#1A55D0;color:#fff;font-size:15px;font-weight:600;\">Começar<\u002Fa>\n      <\u002Fdiv>\n      <div style=\"background:#fff;border:1px solid #EBE5DB;border-radius:20px;padding:30px;display:flex;flex-direction:column;\">\n        <h3 style=\"font-size:15px;font-weight:600;color:#6B655D;margin-bottom:16px;\">Mensal · 8 aulas<\u002Fh3>\n        <div style=\"font-size:36px;font-weight:600;letter-spacing:-.03em;margin-bottom:4px;\">R$ 600<span style=\"font-size:14px;font-weight:400;color:#8C857A;\">/mês<\u002Fspan><\u002Fdiv>\n        <div style=\"font-size:13px;color:#8C857A;margin-bottom:24px;\">2 aulas por semana<\u002Fdiv>\n        <ul style=\"flex:1;margin-bottom:26px;\">\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">8 aulas de 50 min<\u002Fli>\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">Evolução mais rápida<\u002Fli>\n          <li style=\"font-size:14.5px;color:#5A544C;padding:8px 0;\">Prioridade de horários<\u002Fli>\n        <\u002Ful>\n        <a href=\"#contato\" style=\"display:flex;justify-content:center;padding:13px;border-radius:999px;border:1px solid #DDD5C8;font-size:15px;font-weight:500;\">Começar<\u002Fa>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n<\u002Fsc-if>\n\n<section id=\"contato\" style=\"padding:clamp(56px,7vw,104px) 22px;\">\n  <div style=\"max-width:1140px;margin:0 auto;background:#16130F;border-radius:28px;padding:clamp(30px,4vw,56px);display:flex;flex-wrap:wrap;gap:clamp(30px,5vw,56px);\">\n    <div style=\"flex:1 1 320px;min-width:min(100%,280px);\">\n      <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#8FB2F2;font-weight:600;margin-bottom:18px;\"><span style=\"width:18px;height:1px;background:#8FB2F2;display:block;\"><\u002Fspan>Aula experimental<\u002Fspan>\n      <h2 style=\"font-size:clamp(28px,4vw,42px);letter-spacing:-.03em;font-weight:600;color:#fff;margin-bottom:16px;text-wrap:balance;\">Bora descobrir o melhor caminho pro seu inglês?<\u002Fh2>\n      <p style=\"font-size:17px;color:#A8A197;max-width:420px;margin-bottom:26px;text-wrap:pretty;\">Conte um pouco sobre você. Respondo pelo WhatsApp para combinarmos os 20 minutos de conversa inicial — gratuita e sem compromisso.<\u002Fp>\n      <ul style=\"display:flex;flex-direction:column;gap:10px;\">\n        <li style=\"font-size:15px;color:#C9C3B9;display:flex;gap:11px;align-items:baseline;\"><span style=\"color:#8FB2F2;font-weight:700;\">—<\u002Fspan>Resposta no mesmo dia<\u002Fli>\n        <li style=\"font-size:15px;color:#C9C3B9;display:flex;gap:11px;align-items:baseline;\"><span style=\"color:#8FB2F2;font-weight:700;\">—<\u002Fspan>Horários de manhã, noite e sábado<\u002Fli>\n        <li style=\"font-size:15px;color:#C9C3B9;display:flex;gap:11px;align-items:baseline;\"><span style=\"color:#8FB2F2;font-weight:700;\">—<\u002Fspan>Nenhuma cobrança na conversa inicial<\u002Fli>\n      <\u002Ful>\n    <\u002Fdiv>\n\n    <div style=\"flex:1 1 380px;min-width:min(100%,290px);background:#fff;border-radius:22px;padding:clamp(24px,3vw,34px);\">\n      <form sc-camel-on-submit=\"{{ onSubmit }}\" style=\"display:flex;flex-direction:column;gap:18px;\">\n        <label style=\"display:flex;flex-direction:column;gap:7px;\">\n          <span style=\"font-size:13.5px;font-weight:600;\">Seu nome<\u002Fspan>\n          <input type=\"text\" required=\"{{ true }}\" value=\"{{ nome }}\" sc-camel-on-change=\"{{ onNome }}\" placeholder=\"Como você se chama?\" style=\"padding:13px 15px;border:1px solid #DDD5C8;border-radius:12px;font-size:15px;background:#FBF9F6;\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:7px;\">\n          <span style=\"font-size:13.5px;font-weight:600;\">E-mail<\u002Fspan>\n          <input type=\"email\" required=\"{{ true }}\" value=\"{{ email }}\" sc-camel-on-change=\"{{ onEmail }}\" placeholder=\"voce@email.com\" style=\"padding:13px 15px;border:1px solid #DDD5C8;border-radius:12px;font-size:15px;background:#FBF9F6;\">\n        <\u002Flabel>\n        <label style=\"display:flex;flex-direction:column;gap:7px;\">\n          <span style=\"font-size:13.5px;font-weight:600;\">Seu nível hoje<\u002Fspan>\n          <sc-raw-select required=\"{{ true }}\" value=\"{{ nivel }}\" sc-camel-on-change=\"{{ onNivel }}\" style=\"padding:13px 15px;border:1px solid #DDD5C8;border-radius:12px;font-size:15px;background:#FBF9F6;appearance:none;\">\n            <option value=\"\">Selecione<\u002Foption>\n            <option value=\"Começando do zero\">Começando do zero<\u002Foption>\n            <option value=\"Básico — entendo pouco\">Básico — entendo pouco<\u002Foption>\n            <option value=\"Intermediário — travo na hora de falar\">Intermediário — travo na hora de falar<\u002Foption>\n            <option value=\"Avançado — quero fluência e naturalidade\">Avançado — quero fluência<\u002Foption>\n          <\u002Fsc-raw-select>\n        <\u002Flabel>\n        <div style=\"display:flex;flex-direction:column;gap:9px;\">\n          <span style=\"font-size:13.5px;font-weight:600;\">Seu objetivo<\u002Fspan>\n          <div style=\"display:flex;flex-wrap:wrap;gap:8px;\">\n            <sc-for list=\"{{ objetivos }}\" as=\"opt\" hint-placeholder-count=\"5\">\n              <button type=\"button\" sc-camel-on-click=\"{{ opt.select }}\" style=\"{{ opt.style }}\">{{ opt.label }}<\u002Fbutton>\n            <\u002Fsc-for>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <button type=\"submit\" style=\"margin-top:4px;padding:15px;border:none;border-radius:999px;background:#1A55D0;color:#fff;font-size:16px;font-weight:600;cursor:pointer;box-shadow:0 8px 22px -12px rgba(26,85,208,.7);\">Quero minha aula experimental<\u002Fbutton>\n        <p style=\"font-size:12.5px;color:#8C857A;text-align:center;line-height:1.45;\">Ao enviar, abre uma conversa no WhatsApp com esses dados já preenchidos.<\u002Fp>\n      <\u002Fform>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<section style=\"padding:0 22px clamp(56px,7vw,104px);\">\n  <div style=\"max-width:760px;margin:0 auto;\">\n    <span style=\"display:inline-flex;align-items:center;gap:9px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#1A55D0;font-weight:600;margin-bottom:18px;\"><span style=\"width:18px;height:1px;background:#1A55D0;display:block;\"><\u002Fspan>Perguntas frequentes<\u002Fspan>\n    <h2 style=\"font-size:clamp(26px,3.6vw,38px);letter-spacing:-.03em;font-weight:600;margin-bottom:30px;\">Ainda com dúvida?<\u002Fh2>\n    <details open=\"{{ true }}\" style=\"border-top:1px solid #EBE5DB;padding:20px 0;\">\n      <summary style=\"cursor:pointer;list-style:none;font-size:16.5px;font-weight:600;\">Preciso ter algum nível mínimo de inglês?<\u002Fsummary>\n      <p style=\"font-size:15.5px;color:#6B655D;margin-top:13px;\">Não. As aulas começam do zero ou de onde você estiver — o plano é ajustado depois da conversa inicial gratuita.<\u002Fp>\n    <\u002Fdetails>\n    <details style=\"border-top:1px solid #EBE5DB;padding:20px 0;\">\n      <summary style=\"cursor:pointer;list-style:none;font-size:16.5px;font-weight:600;\">As aulas são individuais ou em grupo?<\u002Fsummary>\n      <p style=\"font-size:15.5px;color:#6B655D;margin-top:13px;\">Individuais. O ritmo e os temas são pensados só pro seu objetivo, sem se adaptar à turma.<\u002Fp>\n    <\u002Fdetails>\n    <details style=\"border-top:1px solid #EBE5DB;padding:20px 0;\">\n      <summary style=\"cursor:pointer;list-style:none;font-size:16.5px;font-weight:600;\">Como funciona a aula experimental?<\u002Fsummary>\n      <p style=\"font-size:15.5px;color:#6B655D;margin-top:13px;\">É uma conversa de 20 minutos, sem custo, pra entender seu nível e combinar o melhor plano pra você.<\u002Fp>\n    <\u002Fdetails>\n    <details style=\"border-top:1px solid #EBE5DB;border-bottom:1px solid #EBE5DB;padding:20px 0;\">\n      <summary style=\"cursor:pointer;list-style:none;font-size:16.5px;font-weight:600;\">Posso cancelar ou remarcar aulas?<\u002Fsummary>\n      <p style=\"font-size:15.5px;color:#6B655D;margin-top:13px;\">Sim, com aviso de 24h você pode remarcar sem custo. Os planos mensais não têm fidelidade obrigatória.<\u002Fp>\n    <\u002Fdetails>\n  <\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fmain>\n\n<footer style=\"padding:0 22px 40px;\">\n  <div style=\"max-width:1140px;margin:0 auto;border-top:1px solid #EBE5DB;padding-top:32px;display:flex;flex-wrap:wrap;gap:26px;justify-content:space-between;\">\n    <div style=\"max-width:300px;\">\n      <div style=\"font-size:18px;font-weight:600;letter-spacing:-.02em;display:flex;align-items:baseline;gap:5px;margin-bottom:8px;\">english<span style=\"font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400;font-size:19px;color:#1A55D0;\">with ray<\u002Fspan><\u002Fdiv>\n      <p style=\"font-size:13.5px;color:#8C857A;\">Aulas particulares de inglês, 100% online, para adultos e adolescentes.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:8px;font-size:14px;color:#6B655D;\">\n      <a href=\"{{ waGeral }}\" target=\"_blank\" rel=\"noopener\">WhatsApp: {{ whatsappDisplay }}<\u002Fa>\n      <span>contato@englishwithrayanne.com<\u002Fspan>\n      <span>@english.rayanne<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"max-width:1140px;margin:26px auto 0;font-size:12.5px;color:#A39C91;\">© 2026 English with Ray — todos os direitos reservados<\u002Fdiv>\n<\u002Ffooter>\n\n<a href=\"{{ waGeral }}\" target=\"_blank\" rel=\"noopener\" aria-label=\"Chamar no WhatsApp\" style=\"position: fixed; bottom: 20px; right: 20px; z-index: 60; width: 54px; height: 54px; border-radius: 50%; color: #fff; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px -8px rgba(22,19,15,.55); background-color: #1A55D0\">\n  <svg sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" style=\"width:24px;height:24px;\"><path d=\"M21 11.5a8.5 8.5 0 0 1-11.87 7.8L3 21l1.7-6.13A8.5 8.5 0 1 1 21 11.5Z\"><\u002Fpath><\u002Fsvg>\n<\u002Fa>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;whatsappNumber&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;5521973684804&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;whatsappDisplay&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;(21) 97368-4804&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Contato&quot;},&quot;showPlanos&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Seções&quot;}}\">\nconst OBJETIVOS = ['Viagem', 'Trabalho / carreira', 'Prova ou certificado', 'Intercâmbio', 'Conversar sem travar'];\n\nclass Component extends DCLogic {\n  state = { nome: '', email: '', nivel: '', objetivo: '' };\n\n  renderVals() {\n    const num = (this.props.whatsappNumber ?? '5521973684804').replace(/\\D/g, '');\n    const wa = (msg) => `https://wa.me/${num}?text=${encodeURIComponent(msg)}`;\n    const { nome, email, nivel, objetivo } = this.state;\n\n    const objetivos = OBJETIVOS.map((label) => {\n      const on = objetivo === label;\n      return {\n        label,\n        select: () => this.setState({ objetivo: label }),\n        style: `padding:9px 15px;border-radius:999px;font-size:14px;cursor:pointer;transition:all .15s ease;border:1px solid ${on ? '#1A55D0' : '#DDD5C8'};background:${on ? '#1A55D0' : '#FBF9F6'};color:${on ? '#fff' : '#16130F'};font-weight:${on ? 600 : 400};`\n      };\n    });\n\n    return {\n      objetivos, nome, email, nivel,\n      showPlanos: this.props.showPlanos ?? true,\n      whatsappDisplay: this.props.whatsappDisplay ?? '(21) 97368-4804',\n      waGeral: wa('Oi Rayanne! Quero saber mais sobre as aulas.'),\n      onNome: (e) => this.setState({ nome: e.target.value }),\n      onEmail: (e) => this.setState({ email: e.target.value }),\n      onNivel: (e) => this.setState({ nivel: e.target.value }),\n      onSubmit: (e) => {\n        e.preventDefault();\n        const linhas = [\n          `Oi Rayanne! Quero agendar a aula experimental.`,\n          `Nome: ${nome}`,\n          `E-mail: ${email}`,\n          `Nível: ${nivel || 'não informado'}`,\n          `Objetivo: ${objetivo || 'não informado'}`\n        ];\n        window.open(wa(linhas.join('\\n')), '_blank', 'noopener');\n      }\n    };\n  }\n}\n\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
